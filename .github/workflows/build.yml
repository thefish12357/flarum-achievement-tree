name: JavaScript

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: JS / Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension/flarum-achievement-tree/js
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: '18'
      - run: npm ci
      - run: npm run build
