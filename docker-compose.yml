services:
  db:
    image: mariadb:10.11
    container_name: flarum-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-flarum}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-flarum}
      MYSQL_USER: ${MYSQL_USER:-flarum}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-flarum}
    volumes:
      - db-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  php:
    build: ./php
    container_name: flarum-php
    restart: unless-stopped
    working_dir: /var/www/flarum
    volumes:
      - ./flarum:/var/www/flarum
      - "./extension/flarum-achievement-tree:/var/www/flarum/workbench/flarum-achievement-tree"
    environment:
      XDEBUG_MODE: debug
      # 设为 1 可强制每次请求都进入调试
      XDEBUG_TRIGGER: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.25-alpine
    container_name: flarum-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./flarum:/var/www/flarum
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

volumes:
  db-data:
